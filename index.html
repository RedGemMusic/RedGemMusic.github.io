<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedGemMusic</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #1a1a1a; color: #e0e0e0; padding: 20px 16px 40px; line-height: 1.4;
        }
        a { color: #4a9eff; text-decoration: none; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #fff; margin: 34px 0 6px; }
        .tag { color: #888; margin-bottom: 24px; }
        .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
        .card { display: block; background: #2a2a2a; border: 2px solid #333; border-radius: 10px; padding: 20px; color: #e0e0e0; }
        .card:hover { border-color: #4a9eff; }
        .card .icon { font-size: 34px; margin-bottom: 8px; }
        .card h2 { color: #fff; font-size: 18px; margin-bottom: 6px; }
        .card p { color: #888; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>RedGemMusic</h1>
        <p class="tag">Companion pages for the Peak VGM 24/7 video game music stream.</p>
        <div class="cards">
            <a class="card" href="playlist/">
                <div class="icon">🎵</div>
                <h2>Playlist</h2>
                <p>Every song on the stream, searchable by game and title.</p>
            </a>
            <a class="card" href="minigames/">
                <div class="icon">🎮</div>
                <h2>Minigames</h2>
                <p>Progress and leaderboards for the chat minigames.</p>
            </a>
        </div>
    </div>
</body>
</html>
